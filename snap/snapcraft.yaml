name: slotr_app
version: 1.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-slotr_app: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.slotr_app # adjust accordingly to your app name

apps:
  slotr_app:
    command: slotr_app
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-slotr_app
parts:
  slotr_app:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
