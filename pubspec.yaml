name: slotr_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil_plus: ^1.6.0
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.1.0
  get_it: ^9.3.0
  go_router: ^18.0.1
  dio: ^5.11.1
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  flutter_dotenv: ^6.0.1
  socket_io_client: ^2.0.3+1
  intl: ^0.20.3
  logger: ^2.8.0
  path_provider: ^2.1.6
  flutter_animate: ^4.5.0
  toastification: ^2.3.0
  easy_date_timeline: ^2.0.9
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0
  build_runner: ^2.16.1
  retrofit_generator: ^10.2.11
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/icon.png

icons_launcher:
  image_path: "assets/images/icon.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
    macos:
      enable: true
    windows:
      enable: true
    web:
      enable: true
    linux:
      enable: true
